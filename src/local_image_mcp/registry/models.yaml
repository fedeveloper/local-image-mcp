# Built-in model registry for local-image-mcp.
#
# sdcpp entries were checked against stable-diffusion.cpp commit 532d2c1
# (docs/models/z_image.md and docs/models/flux2.md), and z-image-turbo was tested on
# Windows 11 + RTX 5060 8 GB with sd-cli commit 5dcfa79 (2026-11-15).
#
# Every repository and file name below was checked against the Hugging Face file
# listings on 2026-11-15. For each file, the resolver uses the first candidate that is
# in the local cache: the main entry, then the `alternatives` in order. So any of the
# listed quantizations works without a change here.
#
# Override or extend this file with a user registry (see LOCAL_IMAGE_REGISTRY).
# Licenses apply to the model weights, not to this code.
schema_version: 1
models:
  z-image-turbo:
    display_name: Z-Image-Turbo (GGUF)
    backend: sdcpp
    capabilities: [text2img]
    license: apache-2.0
    license_url: https://huggingface.co/Tongyi-MAI/Z-Image-Turbo
    vram_estimate_gb: 5.5  # measured: 5.3 GB peak, Q5_K_M, 1024x1024, text encoder on CPU
    supports_negative_prompt: false
    prompt_notes: >-
      English prompt. Structure: subject, scene, composition, lighting, style.
      No negative prompt: write constraints in the prompt itself.
    files:
      diffusion_model:
        repo: unsloth/Z-Image-Turbo-GGUF
        filename: z-image-turbo-Q4_K_M.gguf
        license: apache-2.0
        alternatives:
          - {repo: unsloth/Z-Image-Turbo-GGUF, filename: z-image-turbo-Q5_K_M.gguf}
          - {repo: unsloth/Z-Image-Turbo-GGUF, filename: z-image-turbo-Q4_K_S.gguf}
          - {repo: unsloth/Z-Image-Turbo-GGUF, filename: z-image-turbo-Q6_K.gguf}
          - {repo: unsloth/Z-Image-Turbo-GGUF, filename: z-image-turbo-Q3_K_M.gguf}
          - {repo: unsloth/Z-Image-Turbo-GGUF, filename: z-image-turbo-Q8_0.gguf}
      text_encoder:
        # Diffusers layout, sharded bf16 (~8 GB): run it on the CPU (text_encoder_on_cpu).
        repo: unsloth/Z-Image-Turbo
        filename: text_encoder/model.safetensors.index.json
        license: apache-2.0
        alternatives:
          - {repo: unsloth/Qwen3-4B-Instruct-2507-GGUF, filename: Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      vae:
        repo: unsloth/Z-Image-Turbo
        filename: vae/diffusion_pytorch_model.safetensors
        license: apache-2.0
        alternatives:
          - {repo: Comfy-Org/z_image_turbo, filename: split_files/vae/ae.safetensors}
          - {repo: black-forest-labs/FLUX.1-schnell, filename: ae.safetensors}
    defaults:
      width: 1024
      height: 1024
      steps: 8
      cfg_scale: 1.0  # sd.cpp meaning: 1.0 = no CFG (diffusers guidance_scale=0)
    limits:
      min_size: 256
      max_size: 2048
      size_multiple: 16
      max_pixels: 1572864  # 1536 x 1024
      min_steps: 1
      max_steps: 16
    backend_options:
      offload_to_cpu: true
      text_encoder_on_cpu: true

  flux2-klein-4b:
    display_name: FLUX.2 klein 4B (GGUF)
    backend: sdcpp
    capabilities: [text2img, reference, edit]
    license: apache-2.0
    license_url: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
    vram_estimate_gb: 4.5  # measured: 4.3 GB peak, Q4_K_M, 1024x1024, text encoder on CPU
    supports_negative_prompt: false
    max_reference_images: 4  # sd-cli accepts repeated -r; to verify in Phase 4
    prompt_notes: >-
      English prompt. Structure: subject, scene, composition, lighting, style.
      With reference images, describe the change to make.
    files:
      diffusion_model:
        repo: unsloth/FLUX.2-klein-4B-GGUF
        filename: flux-2-klein-4b-Q4_K_M.gguf
        license: apache-2.0
        alternatives:
          - {repo: unsloth/FLUX.2-klein-4B-GGUF, filename: flux-2-klein-4b-Q5_K_M.gguf}
          - {repo: unsloth/FLUX.2-klein-4B-GGUF, filename: flux-2-klein-4b-Q4_K_S.gguf}
          - {repo: unsloth/FLUX.2-klein-4B-GGUF, filename: flux-2-klein-4b-Q6_K.gguf}
          - {repo: unsloth/FLUX.2-klein-4B-GGUF, filename: flux-2-klein-4b-Q8_0.gguf}
      text_encoder:
        # Diffusers layout, sharded (~7.5 GB): run it on the CPU (text_encoder_on_cpu).
        repo: unsloth/FLUX.2-klein-4B
        filename: text_encoder/model.safetensors.index.json
        license: apache-2.0
        alternatives:
          - {repo: unsloth/Qwen3-4B-GGUF, filename: Qwen3-4B-Q4_K_M.gguf}
      vae:
        repo: unsloth/FLUX.2-klein-4B
        filename: vae/diffusion_pytorch_model.safetensors
        license: apache-2.0
        alternatives:
          - {repo: Comfy-Org/flux2-klein-4B, filename: split_files/vae/flux2-vae.safetensors}
    defaults:
      width: 1024
      height: 1024
      steps: 4
      cfg_scale: 1.0
      sampling_method: euler
    limits:
      min_size: 256
      max_size: 2048
      size_multiple: 16
      max_pixels: 1572864
      min_steps: 1
      max_steps: 16
    backend_options:
      offload_to_cpu: true
      text_encoder_on_cpu: true

  fake:
    display_name: Fake model (solid colour, no GPU; for tests)
    backend: fake
    capabilities: [text2img, reference, edit]
    license: apache-2.0
    supports_negative_prompt: true
    max_reference_images: 4
    defaults:
      width: 256
      height: 256
      steps: 4
      cfg_scale: 1.0
    limits:
      min_size: 16
      max_size: 2048
      size_multiple: 16
      min_steps: 1
      max_steps: 50
